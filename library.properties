name=Smart Connect
version=1.5.0
author=Ashutosh Peri
maintainer=Ashutosh Peri <periashutosh@gmail.com>
sentence=ESP-NOW and Smart Connect receiver library for ESP32 and ESP8266.
paragraph=Pairs with an AIO Transmitter (or any compatible transmitter) and drives a 128x64 SSD1306 OLED with a full connection UI. Handles advertising, handshake (plain ESP_NOW or PIN-authenticated Smart Connect), command reception, and telemetry replies. On ESP32 it runs on its own FreeRTOS task pinned to core 0; on ESP8266 it runs cooperatively via tick().
category=Communication
url=https://github.com/periashutosh-prog/Smart-Connect
architectures=esp32,esp8266
depends=Adafruit GFX Library, Adafruit SSD1306
