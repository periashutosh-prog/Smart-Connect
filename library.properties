name=Smart Connect
version=1.6.0
author=Ashutosh Peri
maintainer=Ashutosh Peri <periashutosh@gmail.com>
sentence=ESP-NOW and Smart Connect receiver library for ESP32 and ESP8266.
paragraph=Pairs with an AIO Transmitter (or any compatible transmitter) and drives an optional 128x64 SSD1306 OLED with a full connection UI. Handles advertising, handshake (plain ESP_NOW or PIN-authenticated Smart Connect), command reception, and telemetry replies. The display is optional in ESP_NOW mode (advertising/handshake need no screen) and required in Smart Connect mode (the PIN has no other way to reach the user) — setup() probes for it and blocks with a clear message until one is connected. On ESP32 it runs on its own FreeRTOS task pinned to core 0; on ESP8266 it runs cooperatively via tick().
category=Communication
url=https://github.com/periashutosh-prog/Smart-Connect
architectures=esp32,esp8266
depends=Adafruit GFX Library, Adafruit SSD1306
